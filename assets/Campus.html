<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amstel Campus</title>
    <link rel="stylesheet" href="../styles/Campus.css">
</head>

<body>

<header class="bovenkant">

    <button class="menu-knop">☰</button>
    <input type="text" placeholder="Zoeken...">
  
</header>

<section class="intro">
    <h1>Amstel Campus</h1>
    <p>Ontdek wat er allemaal te vinden is op het campus</p>
</section>

<section class="eten">
    <h2>Alles qua eten</h2>

    <div class="eten-inhoud">
    
        <div class="plattegrond">
            <div class="water">
                <span>〰〰〰</span>
                Singelgracht
                <span>〰〰〰</span>
            </div>    

            <div class="weg-horizontaal"></div>
            <div class="weg-verticaal"></div>
            <div class="weg weg-1">
                <div class="weg-lijn"></div>
            </div>
            
            <div class="weg dwarsweg-boven"></div>
            <div class="weg hoofdweg"></div>
            <div class="weg kadeweg"></div>

            <div class="weg weg-2"></div>
            <div class="weg weg-3"></div>
            <div class="weg weg-4"></div>

            <div class="fietspad fietspad-1"></div>
            <div class="fietspad fietspad-2"></div>
        
            <div class="klein-gebouw klein-1"></div>
            <div class="klein-gebouw klein-2"></div>
            <div class="klein-gebouw klein-3"></div>
            <div class="klein-gebouw klein-4"></div>
            
            <div class="gras gras-1"></div>
            <div class="gras gras-2"></div>

            <span class="boom boom-1">🌳</span>
            <span class="boom boom-2">🌳</span>
            <span class="boom boom-3">🌳</span>
            <span class="boom boom-4">🌳</span>
            <span class="boom boom-5">🌳</span>
            <span class="boom boom-6">🌳</span>
            <span class="boom boom-7">🌳</span>
            <span class="boom boom-8">🌳</span>
            <span class="boom boom-9">🌳</span>
            <span class="boom boom-10">🌳</span>

            <button class="gebouw bph" data-building="bph">
                <strong>BPH</strong>
                <span>Benno Premselahuis</span>
            </button>

            <button class="gebouw kmh" data-building="kmh">
                <strong>KMH</strong>
                <span>Koetsier-Montaignehuis</span>
            </button>

            <button class="gebouw wbh" data-building="wbh">
                <strong>WBH</strong>
                <span>Wibauthuis</span>
            </button>

            <button class="gebouw ksh" data-building="ksh">
                <strong>KSH</strong>
                <span>Kohnstammhuis</span>
            </button>

            <button class="gebouw tth" data-building="tth">
                <strong>TTH</strong>
                <span>Theo Thijssenhuis</span>
            </button>

            <button class="gebouw mlh" data-building="mlh">
                <strong>MLH</strong>
                <span>Muller-lulofshuis</span>
            </button>

            <button class="gebouw jmh" data-building="jmh">
                <strong>JMH</strong>
                <span>Jakoba Mulderhuis</span>
            </button>
    </div>

    <div class="informatie" id="informatie">

        <h2>Ontdek de campus</h2>

        <p>
            Ga met je muis over een gebouw om meer informatie te bekijken
        </p>

        <h3>🍴 Eten</h3>
        <h3>🐾 Leuk weetje</h3>
        <h3>📍 Locatie</h3>

    </div>
    
</section>

<script src="../scripts/Campus.js"></script>

</body>

</html>
