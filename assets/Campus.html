<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amstel Campus</title>
    <link rel="stylesheet" href="Campus.css">
</head>

<body>

<header class="bovenkant">

    <button class="menu-knop">☰</button>
    <input type="text" placeholder="Zoeken...">
  
</header>

<section class="intro">
    <h1>Amstel Campus</h1>
    <p>Ontdek wat er allemaal te vinden is op het campus</p>
</section>

<section class="eten">
    <h2>Alles qua eten</h2>

    <div class="eten-inhoud">
    
        <div class="plattegrond">
            <button class="gebouw bph" data-building="bhp">
                <strong>BHP</strong>
                <span>Benno Premselahuis</span>
            </button>

            <button class="gebouw kmh" data-building="kmh">
                <strong>KMH</strong>
                <span>Koetsier-Montaignehuis</span>
            </button>

            <button class="gebouw wbh" data-building="wbh">
                <strong>WBH</strong>
                <span>Wibauthuis</span>
            </button>

            <button class="gebouw ksh" data-building="ksh">
                <strong>KSH</strong>
                <span>Kohnstammhuis</span>
            </button>

            <button class="gebouw tth" data-building="tth">
                <strong>TTH</strong>
                <span>Theo Thijssenhuis</span>
            </button>

            <button class="gebouw mlh" data-building="mlh">
                <strong>MLH</strong>
                <span>Muller-lulofshuis</span>
            </button>

            <button class="gebouw jmh" data-building="jmh">
                <strong>JMH</strong>
                <span>Jakoba Mulderhuis</span>
            </button>

            <button class="studio hva" data-building="studio hva">
                <strong>Studio HVA</strong>
                <span>Studio HVA</span>
            </button>
    </div>

    <div class="informatie" id="informatie">

        <h2>Ontdek de campus</h2>

        <p>
            Ga met je muis over een gebouw om meer informatie te bekijken
        </p>

    </div>
    
</section>

</body>

</html>
